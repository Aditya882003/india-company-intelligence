name: Refresh company intelligence

on:
  workflow_dispatch:
  schedule:
    - cron: "30 12 * * 1-5" # 18:00 IST, weekdays

permissions:
  contents: write

concurrency:
  group: data-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Refresh live data
        run: python etl/run_pipeline.py --period 1y
      - name: Validate files
        run: |
          python - <<'PY'
          import sqlite3, pandas as pd
          from pathlib import Path
          root = Path('.')
          db = root/'data/processed/company_intelligence.db'
          assert db.exists(), 'database missing'
          with sqlite3.connect(db) as c:
              companies = pd.read_sql_query('select count(*) n from company_master', c).iloc[0,0]
              prices = pd.read_sql_query('select count(*) n from price_daily', c).iloc[0,0]
          assert companies >= 20
          assert prices >= 1000
          print({'companies': companies, 'price_rows': prices})
          PY
      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw data/processed/company_intelligence.db data/company_master.csv
          git diff --cached --quiet || git commit -m "chore: refresh company intelligence data"
          git push
