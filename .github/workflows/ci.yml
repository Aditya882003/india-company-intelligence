name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt pytest
      - run: pytest -q
      - run: python -m py_compile streamlit_app.py etl/run_pipeline.py etl/make_demo_data.py etl/live_market.py etl/news_sources.py
